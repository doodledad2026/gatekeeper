<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001F5B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003A8A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main Shield -->
  <path d="M100 15 C100 15 60 35 60 85 C60 135 100 165 100 165 C100 165 140 135 140 85 C140 35 100 15 100 15 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>
  
  <!-- Shield highlight -->
  <path d="M100 20 C100 20 65 38 65 85 C65 130 100 158 100 158 C100 158 135 130 135 85 C135 38 100 20 100 20 Z" 
        fill="none" stroke="#C4A77D" stroke-width="2" opacity="0.6"/>
  
  <!-- Checkmark in gold - left stroke -->
  <path d="M80 95 Q85 110 92 118" stroke="#C4A77D" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Checkmark in gold - right stroke -->
  <path d="M92 118 Q110 90 125 65" stroke="#C4A77D" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Shield accent line -->
  <line x1="100" y1="15" x2="100" y2="165" stroke="#C4A77D" stroke-width="1" opacity="0.3"/>
</svg>
